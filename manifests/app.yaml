apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmops-app-recommender
  labels:
    app: llmops-app-recommender

  replicas: 1
  selector:
    matchLabels:
      app: llmops-app-recommender
  template:
    metadata:
      labels:
        app: llmops-app-recommender
    spec:
      containers:
        - name: llmops-app-recommender
          image: llmops-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: llmops-secrets 
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: llmops-app-recommender
  labels:
    app: llmops-app-recommender
spec:
  type: ClusterIP
  selector:
    app: llmops-app-recommender
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8501
